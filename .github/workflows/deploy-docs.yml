name: Deploy Docs

on:
  push:
    branches: [master]
    paths:
      - 'web-docs/**'
      - '.github/workflows/deploy-docs.yml'
  # 支持手动触发
  workflow_dispatch:

concurrency:
  group: deploy-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy to Netlify
    runs-on: ubuntu-latest
    # 防止 fork 触发部署
    if: github.repository == 'luoguoxiong/aipack'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: pnpm
          cache-dependency-path: web-docs/pnpm-lock.yaml

      - name: Install dependencies
        # web-docs 不在根 pnpm-workspace.yaml 成员列表中,但 pnpm 会向上查找发现根 workspace,
        # 导致安装根子项目而非 web-docs 依赖。--ignore-workspace 让 pnpm 把 web-docs 当独立项目安装。
        run: pnpm --dir web-docs install --frozen-lockfile --ignore-workspace

      - name: Build docs
        run: pnpm --dir web-docs build

      - name: Install Netlify CLI
        run: npm install -g netlify-cli

      - name: Deploy to Netlify
        # 必须在 web-docs 目录下执行,否则 Netlify CLI 会扫描整个 monorepo,
        # 检测到 packages/* 和 apps/* 下的多个 package.json,触发
        # "Projects detected" 错误。base=web-docs 仅对 netlify build 生效,
        # netlify deploy --dir 不会使用 base 进行项目过滤。
        working-directory: web-docs
        run: |
          netlify deploy \
            --dir dist \
            --site ${{ secrets.NETLIFY_SITE_ID }} \
            --auth ${{ secrets.NETLIFY_AUTH_TOKEN }} \
            --prod \
            --skip-build
        env:
          # 避免 CI 环境下的交互提示
          CI: true

      - name: Summary
        run: |
          echo "### Docs deployed to Netlify" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Site: https://app.netlify.com/" >> $GITHUB_STEP_SUMMARY
