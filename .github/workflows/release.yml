name: Release

on:
  push:
    branches: [master]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# 顶层 permissions：确保 changesets/action 创建 Version PR 时拥有足够权限
# 注意：同时需要在 GitHub 仓库 Settings → Actions → General 中配置：
#   1. Workflow permissions → Read and write permissions
#   2. 勾选 Allow GitHub Actions to create and approve pull requests
permissions:
  contents: write
  pull-requests: write
  id-token: write
  issues: write

jobs:
  release:
    name: Version & Publish
    runs-on: ubuntu-latest
    # 防止 fork PR 触发发布
    if: github.repository == 'luoguoxiong/aipack'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # changesets/action 需要完整历史来创建 Version PR / commit
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          # 发布需要 npm 鉴权
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm -r --filter "./packages/*" build

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          # 有待处理的 changeset → 创建/更新 "Version Packages" PR
          # 无待处理 changeset（即 Version PR 被合并）→ 执行发布
          publish: pnpm release
          version: pnpm version-packages
          title: "chore(release): version packages"
          commit: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # 让 changeset publish 以 npm 鉴权（setup-node 已配置 .npmrc）
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish summary
        if: steps.changesets.outputs.published == 'true'
        run: |
          echo "### Published packages to npm" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.changesets.outputs.publishedPackages }}" >> $GITHUB_STEP_SUMMARY
