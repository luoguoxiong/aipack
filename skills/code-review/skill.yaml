name: code-review
version: 1.0.0
type: workflow
description: 自动代码审查，检查安全性、性能、可维护性和最佳实践
author: kobot

trigger:
  keywords:
    - review
    - 审查
    - 代码审查
    - code review
    - 审阅
    - CR
    - PR review
  priority: 10

context:
  include:
    - git.diff
    - changed_files
  max_tokens: 8000

runtime:
  timeout: 60000
  retry: 1
