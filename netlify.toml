# Netlify 部署配置 (仓库根目录)
# 文档: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # 构建命令: 显式进入 web-docs 并用 --ignore-workspace 安装依赖
  # web-docs 不在根 pnpm-workspace.yaml 成员列表中 (只有 packages/* 和 apps/*),
  # 但 pnpm 会向上查找发现根 workspace,导致安装 14 个根子项目而非 web-docs 依赖。
  # --ignore-workspace 让 pnpm 把 web-docs 当独立项目安装。
  command = "cd web-docs && pnpm install --frozen-lockfile --ignore-workspace && pnpm build"
  # 发布目录 (vite.config.ts 中 outDir: '../dist')
  publish = "web-docs/dist"

[build.environment]
  # 锁定 Node 版本以匹配本地开发环境
  NODE_VERSION = "18"

# SPA 路由支持: 所有路径回退到 index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 静态资源长缓存 (vite 构建产物带 hash)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML 不缓存,确保更新即时生效
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
