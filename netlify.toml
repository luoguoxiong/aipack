# 仓库根 netlify.toml —— ai_teaching_agent_team 的 Netlify 部署配置
#
# 在 app.netlify.com 连接本仓库后自动生效(Netlify 从仓库根读取本文件):
#   1. Netlify 自动检测 pnpm(根 pnpm-lock.yaml + packageManager 固定版本)并执行 pnpm install
#   2. build command:先构建 agentpack → 再构建应用(vite 前端 + tsc 后端)→ 再打包 Functions
#   3. publish:Vite 构建产物(React 前端静态文件)
#   4. functions:esbuild 打包后的自包含函数(见 apps/ai_teaching_agent_team/scripts/build-functions.mjs)
#   5. redirects:/api/* 转发到对应 Function,其余走 index.html(SPA fallback)

[build]
  command = "pnpm --filter agentpack build && pnpm --filter ai-teaching-agent-team build && pnpm --filter ai-teaching-agent-team build:functions"
  publish = "apps/ai_teaching_agent_team/dist/frontend"
  functions = "apps/ai_teaching_agent_team/netlify/functions-dist"

# 后端 API → Netlify Functions
[[redirects]]
  from = "/api/config"
  to = "/.netlify/functions/config"
  status = 200
  force = true

[[redirects]]
  from = "/api/teach"
  to = "/.netlify/functions/teach"
  status = 200
  force = true

# SPA fallback:其余路径回退到 index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
