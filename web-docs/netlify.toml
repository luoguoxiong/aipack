# web-docs Netlify 部署配置
# 文档: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # 构建命令: 安装依赖并构建生产产物
  command = "pnpm install --frozen-lockfile && pnpm build"
  # 构建产物目录 (vite.config.ts 中 outDir: '../dist')
  publish = "dist"

[build.environment]
  # 锁定 Node 版本以匹配本地开发环境
  NODE_VERSION = "18"
  # 启用 pnpm
  NPM_FLAGS = "--version"

# SPA 路由支持: 所有路径回退到 index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 静态资源长缓存 (vite 构建产物带 hash)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML 不缓存,确保更新即时生效
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
